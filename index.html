<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kami Groupe</title>
  <meta name="theme-color" content="#0f1115">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><span class="logo">神</span><span id="brand-name">Kami Groupe</span></div>
    <nav id="nav">
      <a href="#dashboard" data-view="dashboard"><span>◧</span>Tableau de bord</a>
      <a href="#planning" data-view="planning"><span>▦</span>Planning</a>
      <a href="#dossiers" data-view="dossiers"><span>☰</span>Dossiers</a>
      <a href="#commissions" data-view="commissions"><span>€</span>Commissions</a>
      <a href="#parametres" data-view="parametres"><span>⚙</span>Paramètres</a>
    </nav>
  </aside>

  <main id="main"></main>

  <dialog id="modal">
    <form id="modal-form" method="dialog"></form>
  </dialog>

  <dialog id="confirm">
    <form method="dialog" class="confirm-box">
      <p id="confirm-msg"></p>
      <div class="btn-row" style="justify-content:flex-end">
        <button class="btn" value="cancel">Annuler</button>
        <button class="btn danger" id="confirm-ok" value="ok">Confirmer</button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
